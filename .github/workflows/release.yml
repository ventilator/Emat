name: release

# Baut Emat unter Windows (Lazarus/FPC, i386-win32) und haengt das Zip an
# ein GitHub-Release. Ausgeloest von einem Tag-Push (v*), sonst nur Artefakt.

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Quellen holen
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # git describe braucht die Tags

      - name: Lazarus 4.8 mit FPC 3.2.2 installieren
        shell: pwsh
        run: |
          # Das chocolatey-Paket bringt keinen i386-win32-Compiler mit; der
          # offizielle 32-Bit-Installer legt C:\lazarus und C:\FPC\3.2.2 an.
          # downloads.sourceforge.net liefert die Datei direkt aus (die
          # /projects/.../download-URL liefert nur eine HTML-Zwischenseite).
          $url = 'https://downloads.sourceforge.net/project/lazarus/Lazarus%20Windows%2032%20bits/Lazarus%204.8/lazarus-4.8-fpc-3.2.2-win32.exe'
          $exe = Join-Path $env:RUNNER_TEMP 'lazarus-setup.exe'
          Invoke-WebRequest -Uri $url -OutFile $exe -MaximumRedirection 10
          $len = (Get-Item $exe).Length
          Write-Host ("Download: {0:N0} Bytes" -f $len)
          if ($len -lt 50MB) {
            Get-Content $exe -TotalCount 5
            throw "Download zu klein ($len Bytes) - vermutlich eine HTML-Seite statt des Installers"
          }
          Start-Process -FilePath $exe -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART','/SP-' -Wait
          Get-ChildItem 'C:\lazarus\lazbuild.exe', 'C:\FPC\3.2.2\bin\i386-win32\ppc386.exe' -ErrorAction SilentlyContinue |
            Format-Table FullName, Length

      - name: Release bauen
        shell: cmd
        env:
          NOPAUSE: '1'
        run: build-release.bat

      - name: Zip pruefen
        shell: pwsh
        run: |
          Get-ChildItem release | Format-Table Name, Length
          if (-not (Test-Path release\*.zip)) { throw 'Kein Zip erzeugt' }

      - name: GitHub-Release anlegen
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/*.zip
            release/*.sha256
          generate_release_notes: true
          prerelease: true
          body: |
            Portierung von Emat auf Lazarus/FPC (Windows, 32 Bit).

            Enthalten: Emat.exe, bass.dll, basswma.dll, Lizenzhinweise.
            BASS steht nicht unter der GPL - siehe LICENSE-NOTICE.txt im Zip.

      - name: Artefakt fuer manuelle Laeufe
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        uses: actions/upload-artifact@v4
        with:
          name: Emat-win32
          path: release/*
          if-no-files-found: error
